name: EPL Prospective Draw Possibility Shadow

on:
  pull_request:
    paths:
      - 'src/football1/draw_possibility_shadow.py'
      - 'tests/test_draw_possibility_shadow.py'
      - '.github/workflows/draw-possibility-shadow.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  draw-possibility-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Football 1
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run tests
        run: pytest -q

      - name: Reuse frozen canonical database from 4 September audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p frozen-audit data/processed
          gh run download 33924106948 --repo zee6/FlaretTest1 --name epl-audit-output --dir frozen-audit
          DB="$(find frozen-audit -name football1.sqlite -type f -print -quit)"
          if [ -z "$DB" ]; then
            echo "football1.sqlite not found in frozen epl-audit-output artifact"
            exit 1
          fi
          cp "$DB" data/processed/football1.sqlite
          test "$(sha256sum data/processed/football1.sqlite | awk '{print $1}')" = "4b5c751b22608026fb18eb190279c13b41d50ab88055057787c041ae4b841454"

      - name: Freeze future-only Draw Possibility shadow
        run: |
          LOCKED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python -m football1.draw_possibility_shadow \
            --database data/processed/football1.sqlite \
            --source-ledger prospective/ledger.jsonl \
            --output /tmp/draw_possibility_shadow.jsonl \
            --locked-at-utc "$LOCKED_AT"
          python - <<'PY'
          import json
          from pathlib import Path

          rows=[json.loads(line) for line in Path('/tmp/draw_possibility_shadow.jsonl').read_text().splitlines() if line.strip()]
          assert len(rows) == 10, len(rows)
          assert len({r['event_id'] for r in rows}) == 10
          assert all(r['commence_time_utc'] >= '2026-09-12T00:00:00Z' for r in rows)
          assert all(r['decision_weight'] == 0.0 for r in rows)
          assert all(r['draw_possibility']['is_probability'] is False for r in rows)
          assert all(r['policy']['betting_rule'] is None for r in rows)
          assert all(r['policy']['selection_threshold'] is None for r in rows)
          assert all(r['historical_reference']['matches'] == 5340 for r in rows)

          print('LOCKED_AT', rows[0]['shadow_locked_at_utc'])
          print('RECORDS', len(rows))
          for rank, r in enumerate(sorted(rows, key=lambda x: x['draw_possibility']['balance_percentile_0_to_100'], reverse=True), start=1):
              d=r['draw_possibility']
              print('RANK', rank, r['teams']['home'], 'vs', r['teams']['away'], 'gap=', round(d['home_away_probability_gap'], 6), 'possibility=', round(d['balance_percentile_0_to_100'], 2), 'pDraw=', round(r['market_probability']['draw'], 4), 'flags=', d['fixed_predeclared_balance_flags'])
          PY
          sha256sum /tmp/draw_possibility_shadow.jsonl

      - uses: actions/upload-artifact@v4
        with:
          name: epl-prospective-draw-possibility-shadow
          path: /tmp/draw_possibility_shadow.jsonl
          if-no-files-found: error
          retention-days: 90
