name: EPL Historical Closing Line Observer

on:
  pull_request:
    paths:
      - 'src/football1/historical_closing_line.py'
      - 'src/football1/features.py'
      - 'src/football1/offset_slant.py'
      - 'src/football1/market_baseline.py'
      - 'tests/test_historical_closing_line.py'
      - 'pyproject.toml'
      - '.github/workflows/historical-closing-line.yml'
  push:
    branches: [master]
    paths:
      - 'src/football1/historical_closing_line.py'
      - 'src/football1/features.py'
      - 'src/football1/offset_slant.py'
      - 'src/football1/market_baseline.py'
      - 'tests/test_historical_closing_line.py'
      - 'pyproject.toml'
      - '.github/workflows/historical-closing-line.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  historical-closing-line:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Football 1
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run tests
        run: pytest -q

      - name: Reuse frozen canonical database from 4 September audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p frozen-audit data/processed
          gh run download 33924106948 --repo zee6/FlaretTest1 --name epl-audit-output --dir frozen-audit
          DB="$(find frozen-audit -name football1.sqlite -type f -print -quit)"
          if [ -z "$DB" ]; then
            echo "football1.sqlite not found in frozen epl-audit-output artifact"
            find frozen-audit -maxdepth 4 -type f -print
            exit 1
          fi
          cp "$DB" data/processed/football1.sqlite
          echo "FROZEN_AUDIT_RUN=33924106948"
          echo "FROZEN_AUDIT_HEAD_SHA=ada0ebe987323389870d80aca0234be11c18b53d"
          echo "FROZEN_DB_SHA256=$(sha256sum data/processed/football1.sqlite | awk '{print $1}')"

      - name: Run historical closing-line observer
        run: |
          football1-historical-closing-line \
            --database data/processed/football1.sqlite \
            --output data/processed/historical_closing_line_report.json
          python - <<'PY'
          import json
          r = json.load(open('data/processed/historical_closing_line_report.json'))
          print('STATUS', r['status'])
          print('DECISION_WEIGHT', r.get('decision_weight'))
          print('MATCHES', r['matches'])
          print('TEST_SEASONS', r.get('test_seasons'))
          print('OVERALL', r.get('overall'))
          print('QUARTILES', r.get('residual_quartiles'))
          print('SEASONS', r.get('seasons'))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: epl-historical-closing-line-report
          path: data/processed/historical_closing_line_report.json
          if-no-files-found: error
          retention-days: 14
