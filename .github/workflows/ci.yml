name: Unit Tests

on:
  pull_request:
  push:
    branches: [master]
    paths:
      - 'src/football1/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - run: pytest -q
