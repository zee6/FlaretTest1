name: EPL Market Confidence Observer

on:
  pull_request:
    paths:
      - 'src/football1/confidence_observer.py'
      - 'src/football1/model_disagreement.py'
      - 'tests/test_confidence_observer.py'
      - 'pyproject.toml'
      - '.github/workflows/confidence-observer.yml'
  push:
    branches: [master]
    paths:
      - 'src/football1/confidence_observer.py'
      - 'src/football1/model_disagreement.py'
      - 'tests/test_confidence_observer.py'
      - 'pyproject.toml'
      - '.github/workflows/confidence-observer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confidence-observer:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Football 1
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run tests
        run: pytest -q

      - name: Download EPL history
        run: football1-download-epl --from-season 2012 --to-season 2026

      - name: Build canonical database
        run: football1-build-db --input-dir data/raw/football-data --output data/processed/football1.sqlite

      - name: Run market confidence observer
        run: |
          football1-confidence-observer --database data/processed/football1.sqlite --output data/processed/confidence_observer_report.json
          python - <<'PY'
          import json
          r = json.load(open('data/processed/confidence_observer_report.json'))
          print('STATUS', r['status'])
          for name, metrics in r['overall'].items():
              print(name, 'n=', metrics['matches'], 'LL=', metrics['log_loss'], 'Brier=', metrics['brier'], 'observed=', metrics['observed_correct_rate'], 'mean_p=', metrics['mean_predicted_confidence'])
          print('INCREMENTAL', r['incremental_vs_market_recalibrated'])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: epl-confidence-observer-report
          path: data/processed/confidence_observer_report.json
          if-no-files-found: error
          retention-days: 14
