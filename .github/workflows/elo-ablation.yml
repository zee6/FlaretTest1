name: EPL Elo Residual Ablation

on:
  pull_request:
    paths:
      - 'src/football1/elo_ablation.py'
      - 'tests/test_elo_ablation.py'
      - 'pyproject.toml'
      - '.github/workflows/elo-ablation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Football 1
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run tests
        run: pytest -q

      - name: Download EPL history
        run: football1-download-epl --from-season 2012 --to-season 2026

      - name: Build canonical database
        run: football1-build-db --input-dir data/raw/football-data --output data/processed/football1.sqlite

      - name: Run fixed-market Elo ablation
        run: |
          football1-elo-ablation --database data/processed/football1.sqlite --output data/processed/elo_ablation.json
          python - <<'PY'
          import json
          r = json.load(open('data/processed/elo_ablation.json'))
          raw = r['overall_raw_market']
          print('RAW', 'LL=', round(raw['log_loss'], 6), 'Brier=', round(raw['brier'], 6))
          for name, v in r['overall_variants'].items():
              print(name, 'matches=', v['matches'], 'LL=', round(v['log_loss'], 6), 'delta_raw=', round(v['log_loss_delta_vs_raw'], 6), 'Brier=', round(v['brier'], 6), 'Brier_delta_raw=', round(v['brier_delta_vs_raw'], 6), 'ECE=', round(v['top_label_ece'], 6))
          print('INCREMENTAL')
          for k, v in r['incremental_comparisons'].items():
              print(k, round(v, 6))
          print('SEASON MODULAR-vs-LEGACY LL')
          for s in r['seasons']:
              lv = s['variants']['legacy_elo']['log_loss']
              mv = s['variants']['modular_elo_v1']['log_loss']
              print(s['test_season_start_year'], round(mv - lv, 6))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: epl-elo-ablation
          path: data/processed/elo_ablation.json
          if-no-files-found: error
          retention-days: 14
