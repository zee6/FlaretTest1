name: EPL Prospective Error Anatomy

on:
  pull_request:
    paths:
      - 'src/football1/prospective_error_anatomy.py'
      - 'tests/test_prospective_error_anatomy.py'
      - '.github/workflows/prospective-error-anatomy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prospective-error-anatomy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Football 1
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run tests
        run: pytest -q

      - name: Decompose currently settled prospective probability errors
        run: |
          python -m football1.prospective_error_anatomy \
            --ledger prospective/ledger.jsonl \
            --settlements prospective/settlements.jsonl \
            --output /tmp/prospective_error_anatomy.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/prospective_error_anatomy.json'))
          assert r['status'] == 'descriptive_zero_decision_weight'
          assert r['decision_weight'] == 0.0
          assert r['selection_rule'] is None
          assert r['model_change_allowed_from_report'] is False
          assert r['settled_matches'] == 10
          assert len(r['matches']) == 10
          print('OVERALL', r['overall'])
          print('BY_RESULT', r['by_realized_result'])
          print('HARM', [
              (x['home'], x['away'], x['result'], x['log_loss_delta_model_minus_market'])
              for x in r['largest_log_loss_harm_contributors']
          ])
          print('HELP', [
              (x['home'], x['away'], x['result'], x['log_loss_delta_model_minus_market'])
              for x in r['largest_log_loss_help_contributors']
          ])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: epl-prospective-error-anatomy-first-batch
          path: /tmp/prospective_error_anatomy.json
          if-no-files-found: error
          retention-days: 90
