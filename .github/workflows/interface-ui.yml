name: Web and iPhone UI Build

on:
  pull_request:
    paths:
      - 'web/**'
      - 'ios/Football1Mobile/**'
      - 'prospective/mobile_results.json'
      - '.github/workflows/interface-ui.yml'
  push:
    branches: [master]
    paths:
      - 'web/**'
      - 'ios/Football1Mobile/**'
      - 'prospective/mobile_results.json'
      - '.github/workflows/interface-ui.yml'

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check web/app.js
      - name: Check static interface contract
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('web/index.html').read_text()
          css = Path('web/styles.css').read_text()
          assert 'Winning is an outcome.' in html
          assert 'Eyes Wide Open' in html
          assert 'INTERFACE PREVIEW' in html
          assert 'viewport' in html
          assert '@media(max-width:620px)' in css
          print('web interface contract OK')
          PY

  iphone:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Check native Results data contract
        run: |
          swiftc -swift-version 6 -parse-as-library \
            ios/Football1Mobile/Sources/Football1Mobile/ResultsData.swift \
            ios/Football1Mobile/Tests/ResultsContractTests.swift \
            -o /tmp/football1-results-contract
          /tmp/football1-results-contract prospective/mobile_results.json
      - name: Inspect iPhone project
        working-directory: ios/Football1Mobile
        run: xcodebuild -project Football1Mobile.xcodeproj -scheme Football1Mobile -sdk iphonesimulator -showBuildSettings | grep -E 'PRODUCT_BUNDLE_IDENTIFIER|PRODUCT_NAME|IPHONEOS_DEPLOYMENT_TARGET'
      - name: Build iPhone simulator app
        working-directory: ios/Football1Mobile
        run: |
          xcodebuild \
            -project Football1Mobile.xcodeproj \
            -scheme Football1Mobile \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath .derivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Verify iPhone app bundle
        working-directory: ios/Football1Mobile
        run: |
          test -d '.derivedData/Build/Products/Debug-iphonesimulator/Football 1.app'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' '.derivedData/Build/Products/Debug-iphonesimulator/Football 1.app/Info.plist')" = 'com.riskbrain.Football1Mobile'
      - name: Launch Results in iPhone simulator and capture screen
        run: |
          python3 - <<'PY'
          import json, subprocess, time
          from pathlib import Path
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json']))
          phone = next(device for group in devices['devices'].values() for device in group if 'iPhone' in device['name'])
          udid = phone['udid']
          if phone['state'] != 'Booted':
              subprocess.run(['xcrun', 'simctl', 'boot', udid], check=True)
          subprocess.run(['xcrun', 'simctl', 'bootstatus', udid, '-b'], check=True)
          app = Path('ios/Football1Mobile/.derivedData/Build/Products/Debug-iphonesimulator/Football 1.app')
          subprocess.run(['xcrun', 'simctl', 'install', udid, str(app)], check=True)
          subprocess.run(['xcrun', 'simctl', 'status_bar', udid, 'override', '--time', '9:41', '--batteryState', 'charged', '--batteryLevel', '100'], check=True)
          subprocess.run(['xcrun', 'simctl', 'launch', udid, 'com.riskbrain.Football1Mobile', '--results-preview'], check=True)
          time.sleep(5)
          subprocess.run(['xcrun', 'simctl', 'io', udid, 'screenshot', 'iphone-results.png'], check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iphone-results-simulator
          path: iphone-results.png
          retention-days: 30
