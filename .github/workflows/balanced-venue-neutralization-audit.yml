name: EPL Balanced Venue Neutralization Audit

on:
  pull_request:
    paths:
      - 'src/football1/balanced_venue_neutralization_audit.py'
      - 'tests/test_balanced_venue_neutralization_audit.py'
      - '.github/workflows/balanced-venue-neutralization-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  balanced-venue-neutralization:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Football 1
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run tests
        run: pytest -q

      - name: Reuse frozen canonical database from 4 September audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p frozen-audit data/processed
          gh run download 33924106948 --repo zee6/FlaretTest1 --name epl-audit-output --dir frozen-audit
          DB="$(find frozen-audit -name football1.sqlite -type f -print -quit)"
          if [ -z "$DB" ]; then
            echo "football1.sqlite not found in frozen epl-audit-output artifact"
            exit 1
          fi
          cp "$DB" data/processed/football1.sqlite
          test "$(sha256sum data/processed/football1.sqlite | awk '{print $1}')" = "4b5c751b22608026fb18eb190279c13b41d50ab88055057787c041ae4b841454"

      - name: Run balanced venue-neutralization audit
        run: |
          python -m football1.balanced_venue_neutralization_audit \
            --database data/processed/football1.sqlite \
            --output data/processed/balanced_venue_neutralization_audit.json
          python - <<'PY'
          import json
          r=json.load(open('data/processed/balanced_venue_neutralization_audit.json'))
          assert r['decision_weight'] == 0.0
          assert r['promotion_allowed'] is False
          for block in r['fixed_balance_thresholds']:
              print('THRESHOLD', block['max_home_away_gap'], 'matches', block['matches'], 'away_elo_share', block['away_elo_stronger_share'])
              for group in ('away_elo_stronger','home_elo_at_least_as_strong'):
                  g=block['groups'][group]
                  print(group, 'matches', g['matches'], 'mean_elo', g['mean_raw_elo_diff_home_minus_away'], 'draw', g['outcomes']['draw'], 'away', g['outcomes']['away'])
          print('SEASON_STABILITY')
          for block in r['season_stability']:
              print(block['max_home_away_gap'], block['sign_counts'])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: epl-balanced-venue-neutralization-audit
          path: data/processed/balanced_venue_neutralization_audit.json
          if-no-files-found: error
          retention-days: 90
