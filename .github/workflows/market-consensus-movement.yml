name: EPL Market Consensus Movement Audit

on:
  pull_request:
    paths:
      - 'src/football1/market_consensus_movement.py'
      - 'src/football1/closing_movement_rf.py'
      - 'src/football1/features.py'
      - 'tests/test_market_consensus_movement.py'
      - 'pyproject.toml'
      - '.github/workflows/market-consensus-movement.yml'
  push:
    branches: [master]
    paths:
      - 'src/football1/market_consensus_movement.py'
      - 'src/football1/closing_movement_rf.py'
      - 'src/football1/features.py'
      - 'tests/test_market_consensus_movement.py'
      - 'pyproject.toml'
      - '.github/workflows/market-consensus-movement.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  market-consensus-movement:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Football 1
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run tests
        run: pytest -q

      - name: Download EPL history
        run: football1-download-epl --from-season 2012 --to-season 2026

      - name: Build canonical database
        run: football1-build-db --input-dir data/raw/football-data --output data/processed/football1.sqlite

      - name: Run market-consensus movement audit
        run: |
          football1-market-consensus-movement \
            --database data/processed/football1.sqlite \
            --output data/processed/market_consensus_movement_report.json
          python - <<'PY'
          import json
          r = json.load(open('data/processed/market_consensus_movement_report.json'))
          print('STATUS', r['status'])
          print('ELIGIBLE', r['eligible_matches'])
          print('MATCHES', r['matches'])
          print('TEST_SEASONS', r['test_seasons'])
          print('FIRST_MARKET', r['overall']['first_average_market'])
          print('CLOSING_MARKET', r['overall']['closing_average_market'])
          print('ZERO', r['overall']['no_movement_baseline'])
          print('BASE_RF', r['overall']['base_rf'])
          print('PLUS_PREMIUM', r['overall']['rf_plus_best_price_premium'])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: epl-market-consensus-movement-report
          path: data/processed/market_consensus_movement_report.json
          if-no-files-found: error
          retention-days: 14
