name: EPL Prospective Consensus Movement Integrity

on:
  pull_request:
    paths:
      - 'src/football1/prospective_consensus_movement.py'
      - 'tests/test_prospective_consensus_movement.py'
      - 'pyproject.toml'
      - '.github/workflows/prospective-consensus-movement.yml'
      - '.github/workflows/prospective-snapshot.yml'
  push:
    branches: [master]
    paths:
      - 'src/football1/prospective_consensus_movement.py'
      - 'tests/test_prospective_consensus_movement.py'
      - 'pyproject.toml'
      - '.github/workflows/prospective-consensus-movement.yml'
      - '.github/workflows/prospective-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prospective-consensus-movement:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Football 1
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run focused integrity tests
        run: pytest -q tests/test_prospective_consensus_movement.py

      - name: Verify CLIs are installed
        run: |
          football1-prospective-consensus-movement-lock --help
          football1-prospective-consensus-movement-report --help

      - name: Download EPL history
        run: football1-download-epl --from-season 2012 --to-season 2026

      - name: Build canonical database
        run: football1-build-db --input-dir data/raw/football-data --output data/processed/football1.sqlite

      - name: Create synthetic future common-book snapshots
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def bookmaker(key, title, home, draw, away, update):
              return {
                  'key': key,
                  'title': title,
                  'last_update': update,
                  'markets': [{
                      'key': 'h2h',
                      'outcomes': [
                          {'name': 'Arsenal', 'price': home},
                          {'name': 'Draw', 'price': draw},
                          {'name': 'Chelsea', 'price': away},
                      ],
                  }],
              }

          def snapshot(retrieved, prices):
              return {
                  'provider': 'the-odds-api',
                  'sport_key': 'soccer_epl',
                  'retrieved_at_utc': retrieved,
                  'request': {'regions': 'uk', 'markets': 'h2h', 'odds_format': 'decimal'},
                  'events': [{
                      'id': 'synthetic-prospective-movement-ci',
                      'commence_time': '2026-09-05T15:00:00Z',
                      'home_team': 'Arsenal',
                      'away_team': 'Chelsea',
                      'bookmakers': [
                          bookmaker('book-a', 'Book A', *prices[0], retrieved),
                          bookmaker('book-b', 'Book B', *prices[1], retrieved),
                      ],
                  }],
              }

          Path('data/live').mkdir(parents=True, exist_ok=True)
          Path('data/live/ci_initial.json').write_text(
              json.dumps(snapshot(
                  '2026-09-04T12:00:00+00:00',
                  [(2.20, 3.50, 3.20), (2.24, 3.45, 3.18)],
              )),
              encoding='utf-8',
          )
          Path('data/live/ci_later.json').write_text(
              json.dumps(snapshot(
                  '2026-09-04T18:00:00+00:00',
                  [(2.06, 3.58, 3.38), (2.10, 3.54, 3.34)],
              )),
              encoding='utf-8',
          )
          PY

      - name: Archive initial market and freeze movement forecasts
        run: |
          football1-odds-archive \
            --snapshot data/live/ci_initial.json \
            --archive data/processed/ci_odds.jsonl
          football1-prospective-consensus-movement-lock \
            --database data/processed/football1.sqlite \
            --snapshot data/live/ci_initial.json \
            --ledger data/processed/ci_movement_predictions.jsonl

      - name: Archive later market and score frozen forecasts
        run: |
          football1-odds-archive \
            --snapshot data/live/ci_later.json \
            --archive data/processed/ci_odds.jsonl
          football1-prospective-consensus-movement-report \
            --ledger data/processed/ci_movement_predictions.jsonl \
            --odds-archive data/processed/ci_odds.jsonl \
            --min-common-bookmakers 2 \
            --output data/processed/ci_prospective_consensus_movement_report.json

      - name: Audit integration result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from football1.prospective_consensus_movement import movement_forecast_content_hash

          rows = [
              json.loads(line)
              for line in Path('data/processed/ci_movement_predictions.jsonl').read_text().splitlines()
              if line.strip()
          ]
          assert len(rows) == 1
          row = rows[0]
          stored = row['content_sha256']
          unsigned = dict(row)
          unsigned.pop('content_sha256')
          assert stored == movement_forecast_content_hash(unsigned)
          assert row['decision_weight'] == 0.0
          assert row['policy']['betting_rule'] is None
          assert row['policy']['movement_threshold'] is None
          assert row['policy']['stake_rule'] is None
          for name, block in row['forecasts'].items():
              assert abs(sum(block['movement'].values())) < 1e-9, name

          report = json.loads(Path('data/processed/ci_prospective_consensus_movement_report.json').read_text())
          assert report['matches_scored'] == 1
          assert report['coverage_rate'] == 1.0
          assert report['events'][0]['common_bookmaker_count'] == 2
          assert report['skipped_insufficient_common_bookmakers'] == 0
          assert report['overall']['base_rf']['mean_abs_error_per_outcome'] is not None
          assert report['overall']['rf_plus_best_price_premium']['mean_abs_error_per_outcome'] is not None
          print('STATUS', report['status'])
          print('EVENT', report['events'][0])
          print('OVERALL', report['overall'])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: epl-prospective-consensus-movement-ci-report
          path: data/processed/ci_prospective_consensus_movement_report.json
          if-no-files-found: error
          retention-days: 14
