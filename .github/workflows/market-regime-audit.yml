name: EPL Fixed Market Regime Audit

on:
  pull_request:
    paths:
      - 'src/football1/market_regime_audit.py'
      - 'src/football1/features.py'
      - 'src/football1/offset_slant.py'
      - 'tests/test_market_regime_audit.py'
      - 'pyproject.toml'
      - '.github/workflows/market-regime-audit.yml'
  push:
    branches: [master]
    paths:
      - 'src/football1/market_regime_audit.py'
      - 'src/football1/features.py'
      - 'src/football1/offset_slant.py'
      - 'tests/test_market_regime_audit.py'
      - 'pyproject.toml'
      - '.github/workflows/market-regime-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  market-regime-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Football 1
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run tests
        run: pytest -q

      - name: Download EPL history
        run: football1-download-epl --from-season 2012 --to-season 2026

      - name: Build canonical database
        run: football1-build-db --input-dir data/raw/football-data --output data/processed/football1.sqlite

      - name: Run fixed market regime audit
        run: |
          football1-market-regime-audit \
            --database data/processed/football1.sqlite \
            --output data/processed/market_regime_audit_report.json
          python - <<'PY'
          import json
          r = json.load(open('data/processed/market_regime_audit_report.json'))
          print('STATUS', r['status'])
          print('MATCHES', r['matches'])
          print('TEST_SEASONS', r['test_seasons'])
          for name, block in r['overall']['regimes'].items():
              print(name.upper(), {
                  'matches': block['matches'],
                  'favorite': block['favorite'],
                  'market_ll': block['market']['log_loss'],
                  'football1_ll': block['football1']['log_loss'],
                  'football1_ll_delta': block['football1']['log_loss_delta_vs_market'],
              })
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: epl-market-regime-audit-report
          path: data/processed/market_regime_audit_report.json
          if-no-files-found: error
          retention-days: 14
