name: EPL Prospective Weekend Evaluation

on:
  pull_request:
    paths:
      - 'prospective/settlements.jsonl'
      - 'prospective/ledger.jsonl'
      - 'prospective/shadows/2026-09-12-14/**'
      - 'src/football1/september_recovery_report.py'
      - 'tests/test_september_recovery_report.py'
      - '.github/workflows/prospective-weekend-evaluation.yml'
  push:
    branches: [master]
    paths:
      - 'prospective/settlements.jsonl'
      - 'prospective/ledger.jsonl'
      - 'prospective/shadows/2026-09-12-14/**'
      - 'src/football1/september_recovery_report.py'
      - 'tests/test_september_recovery_report.py'
      - '.github/workflows/prospective-weekend-evaluation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prospective-weekend-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: pip install -e '.[dev]'
      - name: Run tests
        run: pytest -q
      - name: Verify original September bytes and score available evidence
        run: |
          python -m football1.september_recovery_report --output /tmp/september-recovery-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: epl-september-partial-archive-recovery
          path: /tmp/september-recovery-report.json
          if-no-files-found: error
          retention-days: 90
