name: EPL Prospective Weekend Evaluation

on:
  pull_request:
    paths:
      - 'prospective/settlements.jsonl'
      - '.github/workflows/prospective-weekend-evaluation.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prospective-weekend-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Football 1
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run tests
        run: pytest -q

      - name: Recover exact frozen prospective shadows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/r30 /tmp/r15 /tmp/draw
          gh run download 34335029540 --repo zee6/FlaretTest1 --name epl-prospective-recency-shadow --dir /tmp/r30
          gh run download 34337404778 --repo zee6/FlaretTest1 --name epl-prospective-recency-shadow-15d --dir /tmp/r15
          gh run download 34345280458 --repo zee6/FlaretTest1 --name epl-prospective-draw-possibility-shadow --dir /tmp/draw
          test "$(sha256sum /tmp/r30/recency_shadow.jsonl | awk '{print $1}')" = "28de0ae556d1e9f24ee7491118a7ab06ba439563a808b6f49eaa7a581120400c"
          test "$(sha256sum /tmp/r15/recency_shadow_15d.jsonl | awk '{print $1}')" = "c3fcbe7ebd207f3fffd19f0b07b1bf2d3ed763d2343b7e7c59055f589729aef5"
          DRAW="$(find /tmp/draw -name '*.jsonl' -type f -print -quit)"
          test -n "$DRAW"
          cp "$DRAW" /tmp/draw_possibility_shadow.jsonl
          test "$(sha256sum /tmp/draw_possibility_shadow.jsonl | awk '{print $1}')" = "915b174364b631db6fcdfb6e675855dcf527ec18e214daea701ee7d7d6db17ed"

      - name: Run all predeclared prospective reports
        run: |
          python -m football1.prospective_report \
            --ledger prospective/ledger.jsonl \
            --settlements prospective/settlements.jsonl \
            --output /tmp/primary.json

          python -m football1.recency_prospective_report \
            --ledger prospective/ledger.jsonl \
            --settlements prospective/settlements.jsonl \
            --shadow /tmp/r30/recency_shadow.jsonl \
            --shadow /tmp/r15/recency_shadow_15d.jsonl \
            --output /tmp/recency.json

          python -m football1.draw_possibility_prospective_report \
            --shadow /tmp/draw_possibility_shadow.jsonl \
            --ledger prospective/ledger.jsonl \
            --settlements prospective/settlements.jsonl \
            --output /tmp/draw.json

          python -m football1.prospective_error_anatomy \
            --ledger prospective/ledger.jsonl \
            --settlements prospective/settlements.jsonl \
            --output /tmp/error_anatomy.json

          python -m football1.prospective_error_batch_comparison \
            --ledger prospective/ledger.jsonl \
            --settlements prospective/settlements.jsonl \
            --output /tmp/error_batches.json

          python -m football1.prospective_portfolio_report \
            --ledger prospective/ledger.jsonl \
            --settlements prospective/settlements.jsonl \
            --output /tmp/portfolio.json

          python -m football1.prospective_evidence_register \
            --ledger prospective/ledger.jsonl \
            --settlements prospective/settlements.jsonl \
            --movement prospective/movement_predictions.jsonl \
            --primary-report /tmp/primary.json \
            --recency-report /tmp/recency.json \
            --draw-report /tmp/draw.json \
            --portfolio-report /tmp/portfolio.json \
            --output /tmp/evidence_register.json

      - name: Verify complete untouched second batch
        run: |
          python - <<'PY'
          import json
          primary=json.load(open('/tmp/primary.json'))
          rec=json.load(open('/tmp/recency.json'))
          draw=json.load(open('/tmp/draw.json'))
          batches=json.load(open('/tmp/error_batches.json'))
          portfolio=json.load(open('/tmp/portfolio.json'))
          register=json.load(open('/tmp/evidence_register.json'))

          assert primary['prediction_records'] == 20
          assert primary['settled_records'] == 20

          assert rec['shadow_event_count'] == 10
          assert rec['settled_common_event_count'] == 10
          assert rec['unsettled_shadow_event_count'] == 0

          assert draw['shadow_records'] == 10
          assert draw['settled_shadow_records'] == 10

          first, confirmation = batches['batches']
          assert first['prediction_records'] == first['settled_records'] == 10
          assert confirmation['prediction_records'] == confirmation['settled_records'] == 10
          assert confirmation['evidence_stage'] == 'prospective_complete'
          assert batches['comparison']['complete_common_interpretation_allowed'] is True

          assert portfolio['settled_records'] == 20
          assert portfolio['official_research_portfolio']['portfolio']['bets_placed'] == 0
          assert register['master_score'] is None
          assert all(x['decision_weight'] == 0.0 for x in register['lanes'])

          print('PRIMARY', json.dumps(primary['probability_scoring'], sort_keys=True))
          print('RECENCY', json.dumps(rec['models'], sort_keys=True))
          print('DRAW', json.dumps(draw, sort_keys=True))
          print('ERROR_BATCHES', json.dumps(batches, sort_keys=True))
          print('PORTFOLIO_COUNTS', json.dumps(portfolio['shadow_selection_counts'], sort_keys=True))
          print('PORTFOLIO', json.dumps(portfolio['shadow_portfolios'], sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: epl-prospective-weekend-evaluation-2026-09-12-14
          path: |
            /tmp/primary.json
            /tmp/recency.json
            /tmp/draw.json
            /tmp/error_anatomy.json
            /tmp/error_batches.json
            /tmp/portfolio.json
            /tmp/evidence_register.json
          if-no-files-found: error
          retention-days: 90
