name: EPL Recency Audit

on:
  pull_request:
    paths:
      - 'src/football1/recency_audit.py'
      - 'src/football1/features.py'
      - 'src/football1/offset_slant.py'
      - 'tests/test_recency_audit.py'
      - 'pyproject.toml'
      - '.github/workflows/recency-audit.yml'
  push:
    branches: [master]
    paths:
      - 'src/football1/recency_audit.py'
      - 'src/football1/features.py'
      - 'src/football1/offset_slant.py'
      - 'tests/test_recency_audit.py'
      - 'pyproject.toml'
      - '.github/workflows/recency-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  recency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Football 1
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run tests
        run: pytest -q

      - name: Reuse frozen canonical database from 4 September audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p frozen-audit data/processed
          gh run download 33924106948 --repo zee6/FlaretTest1 --name epl-audit-output --dir frozen-audit
          DB="$(find frozen-audit -name football1.sqlite -type f -print -quit)"
          if [ -z "$DB" ]; then
            echo "football1.sqlite not found in frozen epl-audit-output artifact"
            find frozen-audit -maxdepth 4 -type f -print
            exit 1
          fi
          cp "$DB" data/processed/football1.sqlite
          echo "FROZEN_AUDIT_RUN=33924106948"
          echo "FROZEN_AUDIT_HEAD_SHA=ada0ebe987323389870d80aca0234be11c18b53d"
          echo "FROZEN_DB_SHA256=$(sha256sum data/processed/football1.sqlite | awk '{print $1}')"

      - name: Run recency audit
        run: |
          football1-recency-audit \
            --database data/processed/football1.sqlite \
            --output data/processed/recency_audit.json
          python - <<'PY'
          import json
          r = json.load(open('data/processed/recency_audit.json'))
          print('STATUS', r['status'])
          print('DECISION_WEIGHT', r['decision_weight'])
          print('RAW_MARKET', r['overall_raw_market'])
          for name, metrics in r['overall_variants'].items():
              print('VARIANT', name, metrics)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: epl-recency-audit
          path: data/processed/recency_audit.json
          if-no-files-found: error
          retention-days: 14
