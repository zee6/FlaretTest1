name: EPL Draw Jury Audit

on:
  push:
    branches: [master]
    paths:
      - 'src/football1/draw_jury_audit.py'
      - 'tests/test_draw_jury_audit.py'
      - '.github/workflows/draw-jury-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  draw-jury:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Football 1
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run unit tests
        run: pytest -q

      - name: Reuse frozen canonical database from 4 September audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p frozen-audit data/processed
          gh run download 33924106948 --repo zee6/FlaretTest1 --name epl-audit-output --dir frozen-audit
          DB="$(find frozen-audit -name football1.sqlite -type f -print -quit)"
          if [ -z "$DB" ]; then
            echo "football1.sqlite not found in frozen epl-audit-output artifact"
            find frozen-audit -maxdepth 4 -type f -print
            exit 1
          fi
          cp "$DB" data/processed/football1.sqlite
          echo "FROZEN_AUDIT_RUN=33924106948"
          echo "FROZEN_AUDIT_HEAD_SHA=ada0ebe987323389870d80aca0234be11c18b53d"
          echo "FROZEN_DB_SHA256=$(sha256sum data/processed/football1.sqlite | awk '{print $1}')"

      - name: Run draw jury diagnostic
        run: |
          python -m football1.draw_jury_audit --database data/processed/football1.sqlite --output data/processed/draw_jury_audit.json
          python - <<'PY'
          import json
          r = json.load(open('data/processed/draw_jury_audit.json'))
          print('STATUS', r['status'])
          print('DECISION_WEIGHT', r['decision_weight'])
          print('PROMOTION_ALLOWED', r['promotion_allowed'])
          print('COMMON_MATCHES', r['common_matches'])
          print('ACTUAL_DRAWS', r['actual_draws'], 'RATE', round(r['actual_draw_rate'], 6))
          print('SCORELINES', r['actual_draw_scoreline_counts'])
          print('DRAW SCOREBOARD')
          ranked = []
          for name, block in r['jurors'].items():
              d = block['draw']
              ranked.append((d['draw_brier'], name, d))
          for _, name, d in sorted(ranked):
              print(
                  name,
                  'Brier=', round(d['draw_brier'], 6),
                  'LL=', round(d['draw_log_loss'], 6),
                  'AUC=', round(d['draw_auc'], 6),
                  'ECE=', round(d['calibration_ece'], 6),
                  'meanP=', round(d['mean_predicted_draw_probability'], 6),
                  'actualDrawP=', round(d['mean_probability_on_actual_draws'], 6),
                  'nonDrawP=', round(d['mean_probability_on_non_draws'], 6),
                  'top20_draw_rate=', round(d['top_20pct']['observed_draw_rate'], 6),
                  'top20_lift=', round(d['top_20pct']['lift_vs_base_rate'], 6),
              )
          print('MULTICLASS CONTEXT')
          for name, block in r['jurors'].items():
              m = block['multiclass_context']
              print(name, 'LL=', round(m['log_loss'], 6), 'Brier=', round(m['brier'], 6), 'Acc=', round(m['accuracy'], 6))
          print('HIGHEST JURY DRAW FIXTURES')
          for row in r['highest_football_jury_draw_matches'][:12]:
              print(row['date'], row['fixture'], row['score'], row['actual'], 'jury=', round(row['football_jury_mean_draw_probability'], 4), 'market=', round(row['market_draw_probability'], 4))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: epl-draw-jury-audit
          path: data/processed/draw_jury_audit.json
          if-no-files-found: error
          retention-days: 14
