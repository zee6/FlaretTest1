name: EPL Odds Archive Integrity

on:
  pull_request:
    paths:
      - 'src/football1/odds_archive.py'
      - 'tests/test_odds_archive.py'
      - 'pyproject.toml'
      - '.github/workflows/prospective-snapshot.yml'
      - '.github/workflows/odds-archive.yml'
  push:
    branches: [master]
    paths:
      - 'src/football1/odds_archive.py'
      - 'tests/test_odds_archive.py'
      - 'pyproject.toml'
      - '.github/workflows/prospective-snapshot.yml'
      - '.github/workflows/odds-archive.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  odds-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Football 1
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run odds archive tests
        run: pytest -q tests/test_odds_archive.py

      - name: Verify archive CLI is installed
        run: football1-odds-archive --help
