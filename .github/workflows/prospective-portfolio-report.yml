name: EPL Prospective Portfolio Observer

on:
  pull_request:
    paths:
      - 'src/football1/prospective_portfolio_report.py'
      - 'tests/test_prospective_portfolio_report.py'
      - 'pyproject.toml'
      - 'prospective/ledger.jsonl'
      - 'prospective/settlements.jsonl'
      - '.github/workflows/prospective-portfolio-report.yml'
  push:
    branches: [master]
    paths:
      - 'src/football1/prospective_portfolio_report.py'
      - 'tests/test_prospective_portfolio_report.py'
      - 'pyproject.toml'
      - 'prospective/ledger.jsonl'
      - 'prospective/settlements.jsonl'
      - '.github/workflows/prospective-portfolio-report.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prospective-portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Football 1
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run tests
        run: pytest -q
      - name: Build prospective portfolio observer
        run: |
          football1-prospective-portfolio-report \
            --ledger prospective/ledger.jsonl \
            --settlements prospective/settlements.jsonl \
            --starting-bankroll 1000 \
            --base-fraction 0.01 \
            --output /tmp/prospective-portfolio.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/prospective-portfolio.json'))
          assert r['settled_records'] == 10
          official=r['official_research_portfolio']['portfolio']
          assert official['bets_placed'] == 0
          assert official['final_bankroll'] == 1000.0
          assert official['max_drawdown_fraction'] == 0.0
          assert r['status'] == 'prospective_research_zero_decision_weight'
          print(json.dumps(r, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: epl-prospective-portfolio-first-week
          path: /tmp/prospective-portfolio.json
          if-no-files-found: error
          retention-days: 90
