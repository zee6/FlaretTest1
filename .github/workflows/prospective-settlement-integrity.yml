name: EPL Prospective Settlement Integrity

on:
  pull_request:
    paths:
      - 'prospective/settlements.jsonl'
      - 'prospective/ledger.jsonl'
      - 'src/football1/settlement.py'
      - 'src/football1/prospective_report.py'
      - '.github/workflows/prospective-settlement-integrity.yml'
  push:
    branches: [master]
    paths:
      - 'prospective/settlements.jsonl'
      - 'prospective/ledger.jsonl'
      - 'src/football1/settlement.py'
      - 'src/football1/prospective_report.py'
      - '.github/workflows/prospective-settlement-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  settlement-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Football 1
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run tests
        run: pytest -q
      - name: Build prospective report and verify immutable settlements
        run: |
          python -m football1.prospective_report --ledger prospective/ledger.jsonl --settlements prospective/settlements.jsonl --output /tmp/prospective-report.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/prospective-report.json').read_text())
          assert report['prediction_records'] == 20
          assert report['settled_records'] == 20
          assert report['unsettled_records'] == 0

          settlements = [json.loads(line) for line in Path('prospective/settlements.jsonl').read_text().splitlines() if line.strip()]
          assert len(settlements) == 20
          assert len({row['prediction_record_id'] for row in settlements}) == 20
          assert len({row['event_id'] for row in settlements}) == 20

          first = settlements[:10]
          second = settlements[10:]
          assert all(row['scores_retrieved_at_utc'] == '2026-09-09T09:41:09+00:00' for row in first)
          assert all(row.get('result_verification', {}).get('source_type') == 'official_premier_league_matchweek_report' for row in first)
          assert all(row['scores_retrieved_at_utc'] == '2026-09-15T06:31:53+00:00' for row in second)
          assert all(row.get('result_verification', {}).get('cross_check') == 'structured_soccer_schedule_summary' for row in second)

          ledger = [json.loads(line) for line in Path('prospective/ledger.jsonl').read_text().splitlines() if line.strip()]
          assert len(ledger) == 20
          assert {row['event_id'] for row in settlements} == {row['event_id'] for row in ledger}

          print(json.dumps(report, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: epl-prospective-settlement-report
          path: /tmp/prospective-report.json
          if-no-files-found: error
