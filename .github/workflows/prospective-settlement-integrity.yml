name: EPL Prospective Settlement Integrity

on:
  pull_request:
    paths:
      - 'prospective/settlements.jsonl'
      - 'prospective/ledger.jsonl'
      - 'src/football1/settlement.py'
      - 'src/football1/prospective_report.py'
      - '.github/workflows/prospective-settlement-integrity.yml'
  push:
    branches: [master]
    paths:
      - 'prospective/settlements.jsonl'
      - 'prospective/ledger.jsonl'
      - 'src/football1/settlement.py'
      - 'src/football1/prospective_report.py'
      - '.github/workflows/prospective-settlement-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  settlement-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Football 1
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run tests
        run: pytest -q

      - name: Build prospective report and verify immutable settlement subset
        run: |
          python -m football1.prospective_report \
            --ledger prospective/ledger.jsonl \
            --settlements prospective/settlements.jsonl \
            --output /tmp/prospective-report.json
          python - <<'PY'
          import json
          from pathlib import Path

          predictions = [
              json.loads(line)
              for line in Path('prospective/ledger.jsonl').read_text().splitlines()
              if line.strip()
          ]
          settlements = [
              json.loads(line)
              for line in Path('prospective/settlements.jsonl').read_text().splitlines()
              if line.strip()
          ]
          report = json.loads(Path('/tmp/prospective-report.json').read_text())

          assert len({row['record_id'] for row in predictions}) == len(predictions)
          assert len({row['event_id'] for row in predictions}) == len(predictions)
          assert len({row['prediction_record_id'] for row in settlements}) == len(settlements)
          assert len({row['event_id'] for row in settlements}) == len(settlements)
          assert len(settlements) <= len(predictions)

          by_id = {row['record_id']: row for row in predictions}
          for row in settlements:
              prediction = by_id[row['prediction_record_id']]
              assert row['event_id'] == prediction['event_id']
              assert row['prediction_content_sha256'] == prediction['content_sha256']

          settled_ids = {row['prediction_record_id'] for row in settlements}
          unresolved = [row for row in predictions if row['record_id'] not in settled_ids]

          assert report['prediction_records'] == len(predictions)
          assert report['settled_records'] == len(settlements)
          assert report['unsettled_records'] == len(unresolved)
          assert report['prediction_records'] == report['settled_records'] + report['unsettled_records']

          print('PREDICTIONS', len(predictions))
          print('SETTLEMENTS', len(settlements))
          print('UNRESOLVED', len(unresolved))
          for row in unresolved:
              print('UNRESOLVED_EVENT', row['commence_time_utc'], row['home_team_provider'], 'vs', row['away_team_provider'])
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: epl-prospective-settlement-report
          path: /tmp/prospective-report.json
          if-no-files-found: error
