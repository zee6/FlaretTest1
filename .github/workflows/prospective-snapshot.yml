name: Record Prospective EPL Snapshot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run unit tests
        run: pytest -q

      - name: Download historical EPL source files
        run: football1-download-epl --from-season 2012 --to-season 2026

      - name: Build canonical database
        run: football1-build-db --input-dir data/raw/football-data --output data/processed/football1.sqlite

      - name: Fetch one live UK 1X2 snapshot
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          test -n "$THE_ODDS_API_KEY" || (echo 'THE_ODDS_API_KEY secret is missing' && exit 1)
          football1-live-odds --regions uk --markets h2h --odds-format decimal --output data/live/epl_odds_snapshot.json

      - name: Append locked predictions
        run: |
          football1-prospective \
            --database data/processed/football1.sqlite \
            --snapshot data/live/epl_odds_snapshot.json \
            --ledger prospective/ledger.jsonl \
            --alpha 0.10

      - name: Verify prospective ledger
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from football1.prospective import prediction_content_hash

          path = Path('prospective/ledger.jsonl')
          rows = [json.loads(line) for line in path.read_text().splitlines() if line.strip()]
          assert rows, 'prospective ledger is empty'
          for i, row in enumerate(rows, start=1):
              stored = row['content_sha256']
              unsigned = dict(row)
              unsigned.pop('content_sha256')
              assert stored == prediction_content_hash(unsigned), f'hash failure on line {i}'
              snap = datetime.fromisoformat(row['snapshot_retrieved_at_utc'].replace('Z', '+00:00'))
              kick = datetime.fromisoformat(row['commence_time_utc'].replace('Z', '+00:00'))
              assert snap < kick, f'non-prospective line {i}'
          print('ledger_records=', len(rows))
          print('latest_snapshot=', rows[-1]['snapshot_retrieved_at_utc'])
          PY

      - name: Commit only the normalized prospective ledger
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prospective/ledger.jsonl
          if git diff --cached --quiet; then
            echo 'No new prospective records to commit'
          else
            git commit -m "Record prospective EPL prediction snapshot"
            git push origin HEAD:master
          fi

      - name: Upload raw live snapshot for short-lived inspection
        uses: actions/upload-artifact@v4
        with:
          name: prospective-live-input
          path: data/live/epl_odds_snapshot.json
          if-no-files-found: error
          retention-days: 7

# Manual-only: each run makes one UK-region x h2h request to The Odds API.
# The raw API response is never committed; only hashed normalized predictions are.
