name: Record Prospective EPL Snapshot

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/prospective-snapshot.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run unit tests
        run: pytest -q

      - name: Download historical EPL source files
        run: football1-download-epl --from-season 2012 --to-season 2026

      - name: Build canonical database
        run: football1-build-db --input-dir data/raw/football-data --output data/processed/football1.sqlite

      - name: Fetch one live UK 1X2 snapshot
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          test -n "$THE_ODDS_API_KEY" || (echo 'THE_ODDS_API_KEY secret is missing' && exit 1)
          football1-live-odds --regions uk --markets h2h --odds-format decimal --output data/live/epl_odds_snapshot.json

      - name: Archive normalized bookmaker quotes
        run: |
          football1-odds-archive \
            --snapshot data/live/epl_odds_snapshot.json \
            --archive prospective/odds_snapshots.jsonl

      - name: Append locked result predictions
        run: |
          football1-prospective \
            --database data/processed/football1.sqlite \
            --snapshot data/live/epl_odds_snapshot.json \
            --ledger prospective/ledger.jsonl \
            --alpha 0.10

      - name: Append locked consensus-movement forecasts
        run: |
          football1-prospective-consensus-movement-lock \
            --database data/processed/football1.sqlite \
            --snapshot data/live/epl_odds_snapshot.json \
            --ledger prospective/movement_predictions.jsonl

      - name: Freeze the 17-19 October recency observers and manifest
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from football1.prospective import prediction_content_hash
          from football1.recency_shadow import build_shadow_records, append_shadow_records, content_hash
          
          def time(value):
              return datetime.fromisoformat(value.replace('Z', '+00:00'))
          
          database = Path('data/processed/football1.sqlite')
          snapshot = json.loads(Path('data/live/epl_odds_snapshot.json').read_text())
          retrieved = snapshot['retrieved_at_utc']
          all_rows = [json.loads(line) for line in Path('prospective/ledger.jsonl').read_text().splitlines() if line.strip()]
          rows = [row for row in all_rows if row['snapshot_retrieved_at_utc'] == retrieved and '2026-10-17' <= row['commence_time_utc'][:10] <= '2026-10-19']
          assert len(rows) == len({row['event_id'] for row in rows}) == 10, f'Expected ten current-slate forecasts, found {len(rows)}'
          rows.sort(key=lambda row: (row['commence_time_utc'], row['record_id']))
          for row in rows:
              unsigned = dict(row)
              stored = unsigned.pop('content_sha256')
              assert stored == prediction_content_hash(unsigned)
              assert time(retrieved) < time(row['commence_time_utc'])
              assert row['model']['historical_data_cutoff'] < retrieved[:10]
              assert row['model']['strategy_threshold'] is None
          
          directory = Path('prospective/shadows/2026-10-17-19')
          assert not directory.exists(), 'Never overwrite a frozen slate'
          directory.mkdir(parents=True)
          shadows = {}
          for half_life in (15, 30):
              locked = datetime.now(timezone.utc).isoformat()
              records, metadata = build_shadow_records(database, rows, locked_at_utc=locked, half_life_days=half_life)
              assert len(records) == 10 and metadata['skipped_already_started'] == 0
              wanted = {row['record_id']: row['content_sha256'] for row in rows}
              for record in records:
                  source = record['source_prediction']
                  assert wanted[source['record_id']] == source['content_sha256']
                  assert time(retrieved) <= time(record['shadow_locked_at_utc']) < time(record['commence_time_utc'])
                  assert record['decision_weight'] == 0.0
                  assert record['recency_policy']['half_life_days'] == half_life
                  assert record['historical_training']['historical_data_cutoff'] < retrieved[:10]
                  unsigned = dict(record)
                  stored = unsigned.pop('content_sha256')
                  assert stored == content_hash(unsigned)
              path = directory / f'recency_{half_life}d.jsonl'
              assert append_shadow_records(path, records) == 10
              shadows[f'recency_{half_life}d'] = {'path': str(path), 'sha256': hashlib.sha256(path.read_bytes()).hexdigest(), 'locked_at_utc': locked}
          
          written = datetime.now(timezone.utc).isoformat()
          assert all(time(written) < time(row['commence_time_utc']) for row in rows), 'Publication preparation must precede every kickoff'
          manifest = {
              'slate': '2026-10-17_to_2026-10-19',
              'scope': 'Ten original pre-kickoff result forecasts; fixed 15/30-day recency observers; no activated betting rule.',
              'snapshot_retrieved_at_utc': retrieved,
              'manifest_written_at_utc': written,
              'prediction_record_ids': [row['record_id'] for row in rows],
              'prediction_content_sha256': [row['content_sha256'] for row in rows],
              'historical_data_cutoff': sorted({row['model']['historical_data_cutoff'] for row in rows}),
              'historical_database_sha256': hashlib.sha256(database.read_bytes()).hexdigest(),
              'raw_snapshot_sha256': hashlib.sha256(Path('data/live/epl_odds_snapshot.json').read_bytes()).hexdigest(),
              'shadow_files': shadows,
              'missing_shadows': {'draw_possibility': 'The original fixed September historical reference database is unavailable; no changed reference or retrospective replacement is substituted.'},
              'decision_weight': 0.0,
              'official_betting_rule': None,
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
          }
          (directory / 'manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Verify prospective records
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from football1.odds_archive import odds_record_hash
          from football1.prospective import prediction_content_hash
          from football1.prospective_consensus_movement import movement_forecast_content_hash

          prediction_path = Path('prospective/ledger.jsonl')
          predictions = [json.loads(line) for line in prediction_path.read_text().splitlines() if line.strip()]
          assert predictions, 'prospective prediction ledger is empty'
          for i, row in enumerate(predictions, start=1):
              stored = row['content_sha256']
              unsigned = dict(row)
              unsigned.pop('content_sha256')
              assert stored == prediction_content_hash(unsigned), f'prediction hash failure on line {i}'
              snap = datetime.fromisoformat(row['snapshot_retrieved_at_utc'].replace('Z', '+00:00'))
              kick = datetime.fromisoformat(row['commence_time_utc'].replace('Z', '+00:00'))
              assert snap < kick, f'non-prospective prediction line {i}'

          movement_path = Path('prospective/movement_predictions.jsonl')
          movement_rows = [json.loads(line) for line in movement_path.read_text().splitlines() if line.strip()]
          assert movement_rows, 'prospective movement ledger is empty'
          for i, row in enumerate(movement_rows, start=1):
              stored = row['content_sha256']
              unsigned = dict(row)
              unsigned.pop('content_sha256')
              assert stored == movement_forecast_content_hash(unsigned), f'movement hash failure on line {i}'
              assert row['decision_weight'] == 0.0, f'nonzero movement decision weight on line {i}'
              snap = datetime.fromisoformat(row['snapshot_retrieved_at_utc'].replace('Z', '+00:00'))
              kick = datetime.fromisoformat(row['commence_time_utc'].replace('Z', '+00:00'))
              assert snap < kick, f'non-prospective movement forecast line {i}'

          odds_path = Path('prospective/odds_snapshots.jsonl')
          odds_rows = [json.loads(line) for line in odds_path.read_text().splitlines() if line.strip()]
          assert odds_rows, 'prospective odds archive is empty'
          for i, row in enumerate(odds_rows, start=1):
              stored = row['content_sha256']
              unsigned = dict(row)
              unsigned.pop('content_sha256')
              assert stored == odds_record_hash(unsigned), f'odds hash failure on line {i}'
              snap = datetime.fromisoformat(row['retrieved_at_utc'].replace('Z', '+00:00'))
              kick = datetime.fromisoformat(row['commence_time_utc'].replace('Z', '+00:00'))
              assert snap < kick, f'non-prospective odds line {i}'
              assert row['complete_h2h_bookmaker_count'] == len(row['bookmakers'])

          print('prediction_records=', len(predictions))
          print('movement_forecast_records=', len(movement_rows))
          print('odds_event_snapshots=', len(odds_rows))
          print('latest_prediction_snapshot=', predictions[-1]['snapshot_retrieved_at_utc'])
          print('latest_movement_snapshot=', movement_rows[-1]['snapshot_retrieved_at_utc'])
          print('latest_odds_snapshot=', odds_rows[-1]['retrieved_at_utc'])
          PY

      - name: Build prospective result-model market movement observer report
        run: |
          football1-market-movement \
            --ledger prospective/ledger.jsonl \
            --odds-archive prospective/odds_snapshots.jsonl \
            --output data/processed/prospective_market_movement_report.json
          python - <<'PY'
          import json
          r = json.load(open('data/processed/prospective_market_movement_report.json'))
          print('STATUS', r['status'])
          print('LOCKED_PREDICTIONS', r['locked_predictions'])
          print('MATCHES_WITH_LATER_MARKET_SNAPSHOT', r['matches_with_later_market_snapshot'])
          print('COVERAGE', r['coverage_rate'])
          print('OVERALL', r['overall'])
          PY

      - name: Build prospective consensus-movement forecast report
        run: |
          football1-prospective-consensus-movement-report \
            --ledger prospective/movement_predictions.jsonl \
            --odds-archive prospective/odds_snapshots.jsonl \
            --min-common-bookmakers 2 \
            --output data/processed/prospective_consensus_movement_report.json
          python - <<'PY'
          import json
          r = json.load(open('data/processed/prospective_consensus_movement_report.json'))
          print('STATUS', r['status'])
          print('LOCKED_FORECASTS', r['locked_forecasts'])
          print('MATCHES_SCORED', r['matches_scored'])
          print('COVERAGE', r['coverage_rate'])
          print('SKIPPED_COMMON_BOOKS', r['skipped_insufficient_common_bookmakers'])
          print('OVERALL', r['overall'])
          PY

      - name: Commit normalized prospective records
        run: |
          python -m football1.mobile_results
          python -m football1.mobile_results --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prospective/ledger.jsonl prospective/movement_predictions.jsonl prospective/mobile_results.json prospective/shadows/2026-10-17-19
          if [ -f prospective/odds_snapshots.jsonl ]; then
            git add prospective/odds_snapshots.jsonl
          fi
          if git diff --cached --quiet; then
            echo 'No new prospective records to commit'
          else
            git commit -m "Record prospective EPL prediction, movement forecast and odds snapshot"
            git push origin HEAD:master
          fi

      - name: Upload raw live snapshot for short-lived inspection
        uses: actions/upload-artifact@v4
        with:
          name: prospective-live-input
          path: data/live/epl_odds_snapshot.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload prospective result-model market movement report
        uses: actions/upload-artifact@v4
        with:
          name: prospective-market-movement-report
          path: data/processed/prospective_market_movement_report.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload prospective consensus-movement forecast report
        uses: actions/upload-artifact@v4
        with:
          name: prospective-consensus-movement-report
          path: data/processed/prospective_consensus_movement_report.json
          if-no-files-found: error
          retention-days: 14

# Manual-only: each run makes one UK-region x h2h request to The Odds API.
# The same snapshot feeds both immutable result and price-movement locks, so the
# new observer consumes no additional API request. Historical movement models are
# retrained only on rows strictly before the snapshot UTC date and receive zero
# decision weight. Later scoring uses only bookmakers present in both snapshots.
