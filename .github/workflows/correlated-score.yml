name: EPL Correlated Score Audit

on:
  pull_request:
    paths:
      - 'src/football1/correlated_score.py'
      - 'src/football1/correlated_score_ablation.py'
      - 'tests/test_correlated_score.py'
      - 'pyproject.toml'
      - '.github/workflows/correlated-score.yml'
  push:
    branches: [master]
    paths:
      - 'src/football1/correlated_score.py'
      - 'src/football1/correlated_score_ablation.py'
      - 'tests/test_correlated_score.py'
      - 'pyproject.toml'
      - '.github/workflows/correlated-score.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  correlated-score:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Football 1
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run tests
        run: pytest -q

      - name: Download EPL history
        run: football1-download-epl --from-season 2012 --to-season 2026

      - name: Build canonical database
        run: football1-build-db --input-dir data/raw/football-data --output data/processed/football1.sqlite

      - name: Run correlated-score audit
        run: |
          football1-correlated-score --database data/processed/football1.sqlite --output data/processed/correlated_score_report.json
          python - <<'PY'
          import json
          r = json.load(open('data/processed/correlated_score_report.json'))
          o = r['overall']
          print('INDEPENDENT', o['independent_poisson'])
          print('BIVARIATE', o['bivariate_poisson'])
          print('GAMMA_FRAILTY', o['gamma_frailty'])
          print('MARKET', o['market'])
          print('CURRENT_FIT', r['current_fit'])
          print('SEASON PARAMETERS')
          for s in r['seasons']:
              print(s['test_season_start_year'], s['fit'])
          PY

      - name: Run market-anchored correlated-score ablation
        run: |
          football1-correlated-score-ablation --database data/processed/football1.sqlite --output data/processed/correlated_score_ablation.json
          python - <<'PY'
          import json
          r = json.load(open('data/processed/correlated_score_ablation.json'))
          print('RAW', r['overall_raw_market'])
          for name, values in r['overall_variants'].items():
              print(name, 'LL=', round(values['log_loss'], 6), 'Brier=', round(values['brier'], 6))
          print('INCREMENTAL', r['incremental'])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: epl-correlated-score-report
          path: |
            data/processed/correlated_score_report.json
            data/processed/correlated_score_ablation.json
          if-no-files-found: error
          retention-days: 14
