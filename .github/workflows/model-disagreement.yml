name: EPL Shadow Model Disagreement Audit

on:
  pull_request:
    paths:
      - 'src/football1/model_disagreement.py'
      - 'tests/test_model_disagreement.py'
      - 'pyproject.toml'
      - '.github/workflows/model-disagreement.yml'
  push:
    branches: [master]
    paths:
      - 'src/football1/model_disagreement.py'
      - 'tests/test_model_disagreement.py'
      - 'pyproject.toml'
      - '.github/workflows/model-disagreement.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-disagreement:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Football 1
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run tests
        run: pytest -q

      - name: Download EPL history
        run: football1-download-epl --from-season 2012 --to-season 2026

      - name: Build canonical database
        run: football1-build-db --input-dir data/raw/football-data --output data/processed/football1.sqlite

      - name: Run shadow model disagreement audit
        run: |
          football1-model-disagreement --database data/processed/football1.sqlite --output data/processed/model_disagreement_report.json
          python - <<'PY'
          import json
          r = json.load(open('data/processed/model_disagreement_report.json'))
          for name, g in r['groups'].items():
              m = g['market']
              s = g['equal_shadow_mean']
              b = g['market_90_shadow_10']
              print(name, 'n=', g['matches'])
              print('  market LL=', m['log_loss'], 'acc=', m['accuracy'])
              print('  shadow LL=', s['log_loss'], 'acc=', s['accuracy'])
              print('  blend LL=', b['log_loss'], 'acc=', b['accuracy'], 'delta=', g['blend_minus_market']['log_loss'])
              print('  blind ROI=', g['blind_one_unit_top_pick'])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: epl-model-disagreement-report
          path: data/processed/model_disagreement_report.json
          if-no-files-found: error
          retention-days: 14
