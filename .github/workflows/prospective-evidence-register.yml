name: EPL Prospective Evidence Register

on:
  pull_request:
    paths:
      - 'src/football1/prospective_evidence_register.py'
      - 'tests/test_prospective_evidence_register.py'
      - '.github/workflows/prospective-evidence-register.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prospective-evidence-register:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Football 1
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run tests
        run: pytest -q

      - name: Recover exact frozen recency and Draw Possibility shadows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/r30 /tmp/r15 /tmp/draw
          gh run download 34335029540 --repo zee6/FlaretTest1 --name epl-prospective-recency-shadow --dir /tmp/r30
          gh run download 34337404778 --repo zee6/FlaretTest1 --name epl-prospective-recency-shadow-15d --dir /tmp/r15
          gh run download 34345280458 --repo zee6/FlaretTest1 --name epl-prospective-draw-possibility-shadow --dir /tmp/draw
          test "$(sha256sum /tmp/r30/recency_shadow.jsonl | awk '{print $1}')" = "28de0ae556d1e9f24ee7491118a7ab06ba439563a808b6f49eaa7a581120400c"
          test "$(sha256sum /tmp/r15/recency_shadow_15d.jsonl | awk '{print $1}')" = "c3fcbe7ebd207f3fffd19f0b07b1bf2d3ed763d2343b7e7c59055f589729aef5"
          DRAW="$(find /tmp/draw -name '*.jsonl' -type f -print -quit)"
          test -n "$DRAW"
          cp "$DRAW" /tmp/draw_possibility_shadow.jsonl
          test "$(sha256sum /tmp/draw_possibility_shadow.jsonl | awk '{print $1}')" = "915b174364b631db6fcdfb6e675855dcf527ec18e214daea701ee7d7d6db17ed"

      - name: Build component reports with existing frozen rules
        run: |
          python -m football1.prospective_report \
            --ledger prospective/ledger.jsonl \
            --settlements prospective/settlements.jsonl \
            --output /tmp/primary.json
          python -m football1.recency_prospective_report \
            --ledger prospective/ledger.jsonl \
            --settlements prospective/settlements.jsonl \
            --shadow /tmp/r30/recency_shadow.jsonl \
            --shadow /tmp/r15/recency_shadow_15d.jsonl \
            --output /tmp/recency.json
          python -m football1.draw_possibility_prospective_report \
            --shadow /tmp/draw_possibility_shadow.jsonl \
            --ledger prospective/ledger.jsonl \
            --settlements prospective/settlements.jsonl \
            --output /tmp/draw.json
          python -m football1.prospective_portfolio_report \
            --ledger prospective/ledger.jsonl \
            --settlements prospective/settlements.jsonl \
            --output /tmp/portfolio.json

      - name: Build zero-weight evidence register
        run: |
          python -m football1.prospective_evidence_register \
            --ledger prospective/ledger.jsonl \
            --settlements prospective/settlements.jsonl \
            --movement prospective/movement_predictions.jsonl \
            --primary-report /tmp/primary.json \
            --recency-report /tmp/recency.json \
            --draw-report /tmp/draw.json \
            --portfolio-report /tmp/portfolio.json \
            --output /tmp/prospective_evidence_register.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/prospective_evidence_register.json'))
          assert r['decision_weight'] == 0.0
          assert r['master_score'] is None
          assert r['aggregation_policy'].startswith('prohibited_')
          assert len(r['lanes']) == 5
          assert all(x['decision_weight'] == 0.0 for x in r['lanes'])
          assert all(x['promotion_eligible_from_current_register'] is False for x in r['lanes'])
          lanes={x['lane_id']:x for x in r['lanes']}
          assert lanes['primary_probability']['state']['prediction_records'] == 20
          assert lanes['primary_probability']['state']['settled_records'] == 10
          assert lanes['general_recency']['state']['shadow_event_count'] == 10
          assert lanes['general_recency']['state']['settled_common_event_count'] == 0
          assert lanes['draw_possibility']['state']['shadow_event_count'] == 10
          assert lanes['draw_possibility']['state']['settled_shadow_event_count'] == 0
          assert lanes['portfolio']['state']['official_bets_placed'] == 0
          assert 'nap' in lanes['draw_possibility']['notes'][0]
          print(json.dumps(r, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: epl-prospective-evidence-register-pre-match
          path: /tmp/prospective_evidence_register.json
          if-no-files-found: error
          retention-days: 90
