name: EPL Balanced Market Outcome Decomposition

on:
  pull_request:
    paths:
      - 'src/football1/balanced_market_outcome_decomposition.py'
      - 'tests/test_balanced_market_outcome_decomposition.py'
      - '.github/workflows/balanced-market-outcome-decomposition.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  balanced-market-outcomes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Football 1
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run tests
        run: pytest -q

      - name: Reuse frozen canonical database from 4 September audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p frozen-audit data/processed
          gh run download 33924106948 --repo zee6/FlaretTest1 --name epl-audit-output --dir frozen-audit
          DB="$(find frozen-audit -name football1.sqlite -type f -print -quit)"
          if [ -z "$DB" ]; then
            echo "football1.sqlite not found in frozen epl-audit-output artifact"
            exit 1
          fi
          cp "$DB" data/processed/football1.sqlite
          test "$(sha256sum data/processed/football1.sqlite | awk '{print $1}')" = "4b5c751b22608026fb18eb190279c13b41d50ab88055057787c041ae4b841454"

      - name: Run balanced-market outcome decomposition
        run: |
          python -m football1.balanced_market_outcome_decomposition \
            --database data/processed/football1.sqlite \
            --output data/processed/balanced_market_outcome_decomposition.json
          python - <<'PY'
          import json
          r=json.load(open('data/processed/balanced_market_outcome_decomposition.json'))
          assert r['decision_weight'] == 0.0
          assert r['promotion_allowed'] is False
          print('OVERALL', r['overall'])
          for block in r['fixed_balance_thresholds']:
              print('THRESHOLD', block['max_home_away_gap'])
              for outcome in ('home','draw','away'):
                  print(outcome, block['outcomes'][outcome])
          print('SEASON_SIGNS')
          for block in r['season_stability']:
              print(block['max_home_away_gap'], block['sign_counts'])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: epl-balanced-market-outcome-decomposition
          path: data/processed/balanced_market_outcome_decomposition.json
          if-no-files-found: error
          retention-days: 90
