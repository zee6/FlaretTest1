name: EPL Poisson Scoreline Audit

on:
  pull_request:
    paths:
      - 'src/football1/scoreline.py'
      - 'src/football1/scoreline_ablation.py'
      - 'tests/test_scoreline.py'
      - 'tests/test_scoreline_ablation.py'
      - 'pyproject.toml'
      - '.github/workflows/scoreline.yml'
  push:
    branches: [master]
    paths:
      - 'src/football1/scoreline.py'
      - 'src/football1/scoreline_ablation.py'
      - 'tests/test_scoreline.py'
      - 'tests/test_scoreline_ablation.py'
      - 'pyproject.toml'
      - '.github/workflows/scoreline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoreline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Football 1
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run tests
        run: pytest -q

      - name: Download EPL history
        run: football1-download-epl --from-season 2012 --to-season 2026

      - name: Build canonical database
        run: football1-build-db --input-dir data/raw/football-data --output data/processed/football1.sqlite

      - name: Run Poisson scoreline audit
        run: |
          football1-scoreline --database data/processed/football1.sqlite --output data/processed/scoreline.json
          python - <<'PY'
          import json
          r = json.load(open('data/processed/scoreline.json'))
          m = r['overall_model']
          p = r['paired_overall']
          print('SCORELINE OOS matches=', m['matches'])
          print('SCORELINE LL=', round(m['log_loss'], 6), 'Brier=', round(m['brier'], 6), 'accuracy=', round(m['accuracy'], 6), 'ECE=', round(m['top_label_ece'], 6))
          print('PAIRED matches=', p['matches'], 'Model_LL=', round(p['model_log_loss'], 6), 'Market_LL=', round(p['market_log_loss'], 6), 'LL_delta=', round(p['log_loss_delta_model_minus_market'], 6))
          print('Model_Brier=', round(p['model_brier'], 6), 'Market_Brier=', round(p['market_brier'], 6), 'Brier_delta=', round(p['brier_delta_model_minus_market'], 6))
          print('SEASON DELTAS')
          for s in r['seasons']:
              q = s['paired_b365_pre_closing']
              print(s['test_season_start_year'], 'matches=', s['test_matches'], 'LL_delta=', round(q['log_loss_delta_model_minus_market'], 6))
          print('LATEST SCORELINE ESTIMATES')
          for x in r['latest_scoreline_estimates'][-8:]:
              print(x['date'], x['home_team'], 'vs', x['away_team'], 'xG-like=', round(x['expected_home_goals'], 2), '-', round(x['expected_away_goals'], 2), 'HDA=', tuple(round(x[k], 3) for k in ('home_prob','draw_prob','away_prob')), 'mode=', x['modal_score'])
          PY

      - name: Run fixed-market Poisson ablation
        run: |
          football1-scoreline-ablation --database data/processed/football1.sqlite --output data/processed/scoreline_ablation.json
          python - <<'PY'
          import json
          r = json.load(open('data/processed/scoreline_ablation.json'))
          raw = r['overall_raw_market']
          print('RAW LL=', round(raw['log_loss'], 6), 'Brier=', round(raw['brier'], 6))
          for name, v in r['overall_variants'].items():
              print(name, 'matches=', v['matches'], 'LL=', round(v['log_loss'], 6), 'delta_raw=', round(v['log_loss_delta_vs_raw'], 6), 'Brier=', round(v['brier'], 6), 'Brier_delta_raw=', round(v['brier_delta_vs_raw'], 6), 'ECE=', round(v['top_label_ece'], 6))
          print('INCREMENTAL')
          for k, v in r['incremental'].items():
              print(k, round(v, 6))
          print('SEASON PLUS-POISSON MINUS BASELINE LL')
          for s in r['seasons']:
              b = s['variants']['frozen_residual_v1']['log_loss']
              p = s['variants']['frozen_residual_plus_poisson_v1']['log_loss']
              print(s['test_season_start_year'], round(p - b, 6))
          print('LATEST STANDARDIZED POISSON WEIGHTS')
          w = r['latest_standardized_weights']['frozen_residual_plus_poisson_v1']
          for side in ('home_vs_draw', 'away_vs_draw'):
              print(side)
              for k, v in w[side].items():
                  if k.startswith('scoreline__'):
                      print(k, round(v, 6))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: epl-poisson-scoreline-report
          path: data/processed/scoreline.json
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: epl-poisson-ablation-report
          path: data/processed/scoreline_ablation.json
          if-no-files-found: error
          retention-days: 14
