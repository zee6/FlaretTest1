name: EPL Prospective Recency Shadow 15d

on:
  pull_request:
    paths:
      - 'src/football1/recency_shadow.py'
      - 'src/football1/recency_audit.py'
      - 'tests/test_recency_shadow.py'
      - '.github/workflows/recency-shadow-15d.yml'
  push:
    branches: [master]
    paths:
      - 'src/football1/recency_shadow.py'
      - 'src/football1/recency_audit.py'
      - 'tests/test_recency_shadow.py'
      - '.github/workflows/recency-shadow-15d.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  recency-shadow-15d:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Football 1
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run tests
        run: pytest -q

      - name: Reuse frozen canonical database from 4 September audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p frozen-audit data/processed
          gh run download 33924106948 --repo zee6/FlaretTest1 --name epl-audit-output --dir frozen-audit
          DB="$(find frozen-audit -name football1.sqlite -type f -print -quit)"
          if [ -z "$DB" ]; then
            echo "football1.sqlite not found in frozen epl-audit-output artifact"
            exit 1
          fi
          cp "$DB" data/processed/football1.sqlite
          echo "FROZEN_DB_SHA256=$(sha256sum data/processed/football1.sqlite | awk '{print $1}')"

      - name: Lock future-only 15-day recency shadow
        run: |
          LOCKED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          football1-recency-shadow \
            --database data/processed/football1.sqlite \
            --source-ledger prospective/ledger.jsonl \
            --output /tmp/recency_shadow_15d.jsonl \
            --locked-at-utc "$LOCKED_AT" \
            --half-life-days 15
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('/tmp/recency_shadow_15d.jsonl')
          rows = [json.loads(x) for x in path.read_text().splitlines() if x.strip()]
          assert len(rows) == 10, len(rows)
          assert all(r['commence_time_utc'] >= '2026-09-12T00:00:00Z' for r in rows)
          assert all(r['decision_weight'] == 0.0 for r in rows)
          assert all(r['recency_policy']['half_life_days'] == 15.0 for r in rows)
          assert all(r['model_id'] == 'fixed_market_offset_football_slant_v1_recency_15d_prospective_shadow' for r in rows)
          assert len({r['event_id'] for r in rows}) == 10
          print('RECORDS', len(rows))
          print('LOCKED_AT', rows[0]['shadow_locked_at_utc'])
          for r in rows:
              print('SHADOW15', r['commence_time_utc'], r['teams'], r['recency_minus_equal_weight'])
          PY
          sha256sum /tmp/recency_shadow_15d.jsonl

      - uses: actions/upload-artifact@v4
        with:
          name: epl-prospective-recency-shadow-15d
          path: /tmp/recency_shadow_15d.jsonl
          if-no-files-found: error
          retention-days: 90
