name: EPL Fixture Congestion Residual Audit

on:
  pull_request:
    paths:
      - 'src/football1/congestion_residual.py'
      - 'src/football1/features.py'
      - 'src/football1/offset_slant.py'
      - 'tests/test_congestion_residual.py'
      - '.github/workflows/congestion-residual.yml'
  push:
    branches: [master]
    paths:
      - 'src/football1/congestion_residual.py'
      - 'src/football1/features.py'
      - 'src/football1/offset_slant.py'
      - 'tests/test_congestion_residual.py'
      - '.github/workflows/congestion-residual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  congestion-residual:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Football 1
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run tests
        run: pytest -q

      - name: Download EPL history
        run: football1-download-epl --from-season 2012 --to-season 2026

      - name: Build canonical database
        run: football1-build-db --input-dir data/raw/football-data --output data/processed/football1.sqlite

      - name: Run fixture-congestion residual audit
        run: |
          python -m football1.congestion_residual --database data/processed/football1.sqlite --output data/processed/congestion_residual_report.json
          python - <<'PY'
          import json
          r = json.load(open('data/processed/congestion_residual_report.json'))
          print('STATUS', r['status'])
          print('OVERALL', r['overall'])
          print('ECONOMICS', r['economics'])
          print('LATEST_WEIGHTS', r['latest_standardized_residual_weights'])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: epl-congestion-residual-report
          path: data/processed/congestion_residual_report.json
          if-no-files-found: error
          retention-days: 14
