name: Publish EPL Elo Research

on:
  push:
    branches: [master]
    paths:
      - 'src/football1/elo.py'
      - 'src/football1/elo_research.py'
      - 'pyproject.toml'
      - '.github/workflows/publish-elo-research.yml'
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-epl-elo-research
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Football 1
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Resolve current EPL season
        id: season
        shell: bash
        run: |
          year=$(date -u +%Y)
          month=$(date -u +%m)
          if [ "$month" -lt 7 ]; then
            season_start=$((year - 1))
          else
            season_start=$year
          fi
          echo "season_start=$season_start" >> "$GITHUB_OUTPUT"

      - name: Download EPL history
        run: football1-download-epl --from-season 2012 --to-season '${{ steps.season.outputs.season_start }}'

      - name: Build canonical database
        run: football1-build-db --input-dir data/raw/football-data --output data/processed/football1.sqlite

      - name: Export app-facing Elo research
        run: football1-elo-research --database data/processed/football1.sqlite --output research/elo_research.json

      - name: Validate public export
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('research/elo_research.json')
          report = json.loads(path.read_text())
          assert report['schema_version'] == 1
          assert report['product_status'] == 'CONTEXT_ONLY'
          assert len(report['current_ratings']) == 20
          assert len(report['histories']) == 20
          print('validated', path, 'latest=', report['latest_match_date'])
          PY

      - name: Publish only when data changed
        shell: bash
        run: |
          git config user.name 'football1-data-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/elo_research.json
          if git diff --cached --quiet; then
            echo 'Elo research data unchanged.'
            exit 0
          fi
          git commit -m 'Update EPL Elo research data'
          git push origin HEAD:master
