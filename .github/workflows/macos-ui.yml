name: macOS UI Build

on:
  pull_request:
    paths:
      - 'macos/Football1App/**'
      - '.github/workflows/macos-ui.yml'
  push:
    branches: [master]
    paths:
      - 'macos/Football1App/**'
      - '.github/workflows/macos-ui.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Inspect Football 1 project
        working-directory: macos/Football1App
        run: xcodebuild -project Football1.xcodeproj -scheme Football1 -showBuildSettings | grep -E 'PRODUCT_BUNDLE_IDENTIFIER|PRODUCT_NAME|WRAPPER_EXTENSION'
      - name: Build Football 1 macOS app bundle
        working-directory: macos/Football1App
        run: |
          xcodebuild \
            -project Football1.xcodeproj \
            -scheme Football1 \
            -configuration Debug \
            -derivedDataPath .derivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Verify app bundle
        working-directory: macos/Football1App
        run: |
          test -d '.derivedData/Build/Products/Debug/Football 1.app'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' '.derivedData/Build/Products/Debug/Football 1.app/Contents/Info.plist'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' '.derivedData/Build/Products/Debug/Football 1.app/Contents/Info.plist')" = 'com.riskbrain.Football1'
