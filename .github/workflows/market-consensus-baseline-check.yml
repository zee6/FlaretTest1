name: EPL Market Consensus Baseline Check

on:
  pull_request:
    paths:
      - 'src/football1/market_consensus_movement.py'
      - 'src/football1/market_consensus_baseline_check.py'
      - 'tests/test_market_consensus_movement.py'
      - 'tests/test_market_consensus_baseline_check.py'
      - 'pyproject.toml'
      - '.github/workflows/market-consensus-baseline-check.yml'
  push:
    branches: [master]
    paths:
      - 'src/football1/market_consensus_movement.py'
      - 'src/football1/market_consensus_baseline_check.py'
      - 'tests/test_market_consensus_movement.py'
      - 'tests/test_market_consensus_baseline_check.py'
      - 'pyproject.toml'
      - '.github/workflows/market-consensus-baseline-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  market-consensus-baseline-check:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Football 1
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run focused tests
        run: pytest -q tests/test_market_consensus_movement.py tests/test_market_consensus_baseline_check.py

      - name: Download EPL history
        run: football1-download-epl --from-season 2012 --to-season 2026

      - name: Build canonical database
        run: football1-build-db --input-dir data/raw/football-data --output data/processed/football1.sqlite

      - name: Run mean-movement control
        run: |
          football1-market-consensus-baseline-check \
            --database data/processed/football1.sqlite \
            --output data/processed/market_consensus_baseline_check.json
          python - <<'PY'
          import json
          r = json.load(open('data/processed/market_consensus_baseline_check.json'))
          print('STATUS', r['status'])
          print('MATCHES', r['matches'])
          print('TEST_SEASONS', r['test_seasons'])
          print('OVERALL', r['overall'])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: epl-market-consensus-baseline-check
          path: data/processed/market_consensus_baseline_check.json
          if-no-files-found: error
          retention-days: 14
