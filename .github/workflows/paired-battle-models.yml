name: EPL Paired Battle Models Audit

on:
  pull_request:
    paths:
      - 'src/football1/davidson.py'
      - 'src/football1/davidson_ablation.py'
      - 'src/football1/nontransitive.py'
      - 'tests/test_paired_battle_models.py'
      - 'pyproject.toml'
      - '.github/workflows/paired-battle-models.yml'
  push:
    branches: [master]
    paths:
      - 'src/football1/davidson.py'
      - 'src/football1/davidson_ablation.py'
      - 'src/football1/nontransitive.py'
      - 'tests/test_paired_battle_models.py'
      - 'pyproject.toml'
      - '.github/workflows/paired-battle-models.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-battle-models:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Football 1
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run tests
        run: pytest -q

      - name: Download EPL history
        run: football1-download-epl --from-season 2012 --to-season 2026

      - name: Build canonical database
        run: football1-build-db --input-dir data/raw/football-data --output data/processed/football1.sqlite

      - name: Run Davidson audit
        run: |
          football1-davidson --database data/processed/football1.sqlite --output data/processed/davidson_report.json
          python - <<'PY'
          import json
          r = json.load(open('data/processed/davidson_report.json'))
          m = r['overall_model']
          p = r['paired_overall']
          print('DAVIDSON OOS matches=', m['matches'])
          print('LL=', round(m['log_loss'], 6), 'Brier=', round(m['brier'], 6), 'accuracy=', round(m['accuracy'], 6), 'ECE=', round(m['top_label_ece'], 6))
          print('PAIRED model_LL=', round(p['model_log_loss'], 6), 'market_LL=', round(p['market_log_loss'], 6), 'delta=', round(p['log_loss_delta_model_minus_market'], 6))
          print('PAIRED model_Brier=', round(p['model_brier'], 6), 'market_Brier=', round(p['market_brier'], 6), 'delta=', round(p['brier_delta_model_minus_market'], 6))
          print('CURRENT draw_factor=', round(r['current_fit']['draw_factor'], 4), 'home_advantage=', round(r['current_fit']['home_advantage'], 4))
          print('TOP CURRENT STRENGTHS')
          for row in r['current_fit']['strengths'][:10]:
              print(row['team'], round(row['strength'], 4))
          print('SEASON LL DELTAS')
          for s in r['seasons']:
              x = s['paired_b365_pre_closing']
              print(s['test_season_start_year'], round(x['log_loss_delta_model_minus_market'], 6))
          PY

      - name: Run Davidson residual ablation
        run: |
          football1-davidson-ablation --database data/processed/football1.sqlite --output data/processed/davidson_ablation.json
          python - <<'PY'
          import json
          r = json.load(open('data/processed/davidson_ablation.json'))
          raw = r['overall_raw_market']
          base = r['overall_variants']['frozen_residual_v1']
          add = r['overall_variants']['frozen_residual_plus_davidson_v1']
          inc = r['incremental']
          print('RAW LL=', round(raw['log_loss'], 6), 'Brier=', round(raw['brier'], 6))
          print('BASE LL=', round(base['log_loss'], 6), 'Brier=', round(base['brier'], 6))
          print('+DAVIDSON LL=', round(add['log_loss'], 6), 'Brier=', round(add['brier'], 6))
          print('INCREMENTAL LL=', round(inc['plus_davidson_minus_baseline_log_loss'], 6), 'Brier=', round(inc['plus_davidson_minus_baseline_brier'], 6))
          PY

      - name: Run non-transitivity audit
        run: |
          football1-nontransitive --database data/processed/football1.sqlite --output data/processed/nontransitive_report.json
          python - <<'PY'
          import json
          r = json.load(open('data/processed/nontransitive_report.json'))
          for w in r['windows']:
              c = w['cycle_audit']
              print(w['window'], 'eligible_pairs=', w['eligible_pair_count'], 'edges=', c['significant_directed_edges'], 'complete_triangles=', c['complete_significant_triangles'], 'cycles=', c['cyclic_triangles'], 'cyclic_share=', c['cyclic_share'])
              for cycle in c['strongest_cycles'][:3]:
                  print('  cycle', ' > '.join(cycle['cycle']), 'strength=', round(cycle['cycle_strength'], 4))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: epl-paired-battle-models
          path: |
            data/processed/davidson_report.json
            data/processed/davidson_ablation.json
            data/processed/nontransitive_report.json
          if-no-files-found: error
          retention-days: 14
