[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "football1"
version = "0.1.0"
description = "EPL probability and market-mispricing research pipeline"
requires-python = ">=3.11"
dependencies = ["scikit-learn>=1.5,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
football1-download-epl = "football1.ingest.football_data:main"
football1-audit-data = "football1.audit:main"
football1-build-db = "football1.build_db:main"
football1-market-baseline = "football1.market_baseline:main"
football1-model-baseline = "football1.model_baseline:main"
football1-slant-model = "football1.slant_model:main"
football1-offset-slant = "football1.offset_slant:main"
football1-mispricing-backtest = "football1.mispricing_backtest:main"
football1-elo = "football1.elo:main"
football1-elo-research = "football1.elo_research:main"
football1-elo-ablation = "football1.elo_ablation:main"
football1-elo-observer = "football1.elo_observer:main"
football1-promotion-prior = "football1.promotion_prior:main"
football1-bayesian-strength = "football1.bayesian_strength:main"
football1-bayesian-strength-ablation = "football1.bayesian_strength_ablation:main"
football1-home-away = "football1.home_away:main"
football1-home-away-ablation = "football1.home_away_ablation:main"
football1-head-to-head = "football1.head_to_head:main"
football1-head-to-head-ablation = "football1.head_to_head_ablation:main"
football1-scoreline = "football1.scoreline:main"
football1-scoreline-ablation = "football1.scoreline_ablation:main"
football1-dixon-coles = "football1.dixon_coles:main"
football1-dixon-coles-ablation = "football1.dixon_coles_ablation:main"
football1-davidson = "football1.davidson:main"
football1-davidson-ablation = "football1.davidson_ablation:main"
football1-nontransitive = "football1.nontransitive:main"
football1-correlated-score = "football1.correlated_score:main"
football1-correlated-score-ablation = "football1.correlated_score_ablation:main"
football1-model-disagreement = "football1.model_disagreement:main"
football1-confidence-observer = "football1.confidence_observer:main"
football1-random-forest-residual = "football1.random_forest_residual:main"
football1-shadow-price-consensus = "football1.shadow_price_consensus:main"
football1-historical-closing-line = "football1.historical_closing_line:main"
football1-closing-movement-rf = "football1.closing_movement_rf:main"
football1-market-regime-audit = "football1.market_regime_audit:main"
football1-market-regime-movement = "football1.market_regime_movement:main"
football1-market-consensus-movement = "football1.market_consensus_movement:main"
football1-market-consensus-baseline-check = "football1.market_consensus_baseline_check:main"
football1-live-odds = "football1.live_odds:main"
football1-double-chance-odds = "football1.double_chance_odds:main"
football1-double-chance-compare = "football1.double_chance_compare:main"
football1-odds-archive = "football1.odds_archive:main"
football1-price-shopping-audit = "football1.price_shopping_audit:main"
football1-price-access-frontier = "football1.price_access_frontier:main"
football1-bet-check = "football1.bet_check:main"
football1-bet-check-reference = "football1.bet_check_reference:main"
