[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "football1"
version = "0.1.0"
description = "EPL probability and market-mispricing research pipeline"
requires-python = ">=3.11"
dependencies = ["scikit-learn>=1.5,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
football1-download-epl = "football1.ingest.football_data:main"
football1-audit-data = "football1.audit:main"
football1-build-db = "football1.build_db:main"
football1-market-baseline = "football1.market_baseline:main"
football1-model-baseline = "football1.model_baseline:main"
football1-slant-model = "football1.slant_model:main"
football1-offset-slant = "football1.offset_slant:main"
football1-mispricing-backtest = "football1.mispricing_backtest:main"
football1-elo = "football1.elo:main"
football1-elo-ablation = "football1.elo_ablation:main"
football1-elo-observer = "football1.elo_observer:main"
football1-home-away = "football1.home_away:main"
football1-home-away-ablation = "football1.home_away_ablation:main"
football1-head-to-head = "football1.head_to_head:main"
football1-head-to-head-ablation = "football1.head_to_head_ablation:main"
football1-scoreline = "football1.scoreline:main"
football1-live-odds = "football1.live_odds:main"
football1-prospective = "football1.prospective:main"
football1-settle = "football1.settlement:main"
football1-prospective-report = "football1.prospective_report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
